name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Canonical production build: npm ci + WebUI build + Go binaries +
      # embedded-asset verification (see Makefile).
      - name: Build
        run: make build

      - name: Verify lock file unchanged
        run: git diff --exit-code -- web/package-lock.json

      - name: Go vet
        run: go vet ./...

      - name: Go tests (race)
        run: go test -race ./...

      - name: Frontend tests
        run: npm test
        working-directory: web
